<div class="panel" data-openby="configBtn">
    <div class="block-header">
        <h2>Configuración</h2>
    </div>
    <div class="block-content">
        <ul class="panel-list">
            {% if user %}
            <li><button id="adminUser">Administrar usuario</button></li>
            {% endif %}
            {% if user and user.get('category') in ('admin', 'root') %}
            <li><a href="{{ url_for('admin_menus.show') }}">Panel de menús</a></li>
            {% endif %}
            {% if user %}
            <li><a href="{{ url_for('public_auth.logout') }}">Cerrar sesión</a></li>
            {% endif %}
        </ul>
    </div>
</div>
