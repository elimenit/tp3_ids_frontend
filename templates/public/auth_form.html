{% if back_img %}
<img src="{{ url_for('static', filename='img/blurry-img.JPG') }}" class="background-image">
{% endif %}
<div class="fixed-block {% if not modal %}open{% endif %}" {% if modal %}data-openby="adminUser"{% endif %}>
    <div class="block signup">
        <div class="block-header">
            <h2>{{ form_heading }}</h2>
            {% if not modal %}
            <a href="{{ url_for('main') }}" class="x-btn-link">
                <svg class="x-btn" xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="m6 6 12 12"/>
                </svg>
            </a>
            {% endif %}
        </div>
        <form action="{{ form_action }}" method="POST">
            <div class="block-content">
                {% if show_username %}
                <div class="form-group">
                    <label for="username">Nombre de usuario:</label>
                    <input type="text" id="username" name="name" {% if user %}value="{{ user.name }}" {% endif %}required>
                </div>
                {% endif %}
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" {% if user %}value="{{ user.email }}" {% endif %}required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" {% if user %}value="{{ user.password }}" {% endif %}required>
                </div>
                {% if show_confirm_password %}
                <div class="form-group">
                    <label for="confirm_password">Confirmar contraseña:</label>
                    <input type="password" id="confirm_password" name="confirm_password" {% if user %}value="{{ user.password }}" {% endif %}required>
                </div>
                {% endif %}
            </div>
            <div class="block-footer">
                {% if modal %}
                <button class="delete-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
                <button class="submit-btn cancel-btn" type="button" id="closeAdminUser">Cancelar</button>
                {% endif %}
                <button class="submit-btn" type="submit">{{ submit_label }}</button>
            </div>
        </form>
    </div>
</div>
