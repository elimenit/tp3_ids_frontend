{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/forms/signup.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/forms/forms.css') }}">
{% endblock %}

{% block header %}

{% endblock %}

{% block title %}Registrarse{% endblock %}

{% block body %}
<img src="{{ url_for('static', filename='img/blurry-img.JPG') }}" class="background-image">
<div class="fixed-block">
  <div class="block signup">
      <div class="block-header">
          <h2>Bienvenido!</h2>
          <a href="{{ url_for('main') }}" class="x-btn-link">
            <svg class="x-btn" xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"/>
              <path d="m6 6 12 12"/>
            </svg>
          </a>
      </div>
      <form action="{{ url_for('public_login.signup') }}" method="post">
        <div class="block-content">
          <div class="form-group">
            <label for="username">Nombre de usuario:</label>
            <input type="text" id="username" name="name" required>
          </div>
          <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirmar Contraseña:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
          </div>
        </div>
        <div class="block-footer">
          <button class="submit-btn" type="submit">Registrarse</button>
        </div>
      </form>
  </div>
</div>
{% endblock %}
