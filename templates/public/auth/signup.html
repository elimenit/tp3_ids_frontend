{% extends "base.html" %}

{% block title %}Registrarse{% endblock %}

{% block body %}
<img src="{{ url_for('static', filename='img/blurry-img.JPG') }}" class="background-image" alt="Fondo borroso del restaurante">

<div class="fixed-block open">
    <div class="block signup">
        <div class="block-header">
            <h2>¡Bienvenido!</h2>
            <a href="{{ url_for('main') }}" class="x-btn-link" aria-label="Cerrar y volver al inicio">
                <svg class="x-btn" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="m6 6 12 12"/>
                </svg>
            </a>
        </div>
        
        <form id="form-signup" action="{{ url_for('public_auth.signup') }}" method="POST">
            <div class="block-content">
                <div class="form-group">
                    <label for="name">Nombre de usuario:</label>
                    <input type="text" id="name" name="name" required autofocus>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>                
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirmar contraseña:</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
            </div>
            
            <div class="block-footer">
                <button class="submit-btn" type="submit" style="width: 100%; margin-bottom: 1rem;">Crear cuenta</button>
                
                <div class="auth-redirect" style="text-align: center; width: 100%; font-size: 0.9em;">
                    <span>¿Ya tienes cuenta?</span>
                    <a href="{{ url_for('public_auth.login') }}" class="link-primary" style="text-decoration: underline;">Inicia sesión aquí</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
